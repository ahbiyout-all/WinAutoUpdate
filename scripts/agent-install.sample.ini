; UpdateAgent silent install settings (student PC)
; Copy this file to agent-install.ini and place it next to
; UpdateAgent.Agent-Setup-<version>-x64.exe.
; Save as UTF-8 without BOM. Lines starting with ';' are ignored.
; Never put the token value here. Only the token file path is stored.
; The token file's first line is the shared agent token.
; Release installers may carry an embedded token for first installs and for
; replacement upgrades. An explicit AgentTokenFile always overrides it.
; Reuse/silent upgrades ignore the embedded token and keep the existing token.
; When replacing without a new URL, the existing LabManagerUrl is preserved.
; Use the teacher PC IP. scripts\deploy-agents.ps1 generates this file with an
; explicit -LabManagerUrl or with -DiscoverLabManager (TCP 5080 health check).

[Agent]
LabManagerUrl=http://<교사-PC-IP>:5080
AgentTokenFile=agent-token.txt

; Relative AgentTokenFile paths resolve from the installer folder.
; Absolute paths are supported too:
; AgentTokenFile=C:\secure\agent-token.txt
; AgentTokenFile=\\server\share\agent-token.txt
