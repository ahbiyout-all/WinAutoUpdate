name: Release

# 릴리스는 v<Major.Minor.Build> 태그 또는 수동 실행으로 만든다.
# 수동 실행에서는 Directory.Build.props의 <Version>만 사용한다(입력으로 버전을 바꾸지 않음).
# 릴리스 자산에는 설치 파일만 올린다. 해시는 릴리스 노트에 기록한다.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  RELEASE_PRERELEASE: ${{ inputs.prerelease }}

jobs:
  release:
    name: Build installers and publish release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve and verify version
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $propsPath = 'Directory.Build.props'
          $text = Get-Content -LiteralPath $propsPath -Raw
          if ($text -notmatch '<Version>\s*([^<]+?)\s*</Version>') {
            throw "No <Version> element found in $propsPath."
          }
          $version = $Matches[1].Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be Major.Minor.Build (digits only): $version"
          }

          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne $tag) {
              throw "Tag $env:GITHUB_REF_NAME does not match Directory.Build.props version $version."
            }
          }
          else {
            # 수동 실행에서 이미 같은 태그가 다른 커밋을 가리키면 잘못된 릴리스를 막는다.
            $existingCommit = (& git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>$null).Trim()
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($existingCommit) -and
                $existingCommit -ne $env:GITHUB_SHA) {
              throw "Tag $tag already points to $existingCommit, not to $env:GITHUB_SHA. Update Directory.Build.props instead."
            }
          }

          Write-Host "Release version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup 6
        id: inno
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $iscc = $null
          foreach ($candidate in @(
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )) {
            if (-not [string]::IsNullOrWhiteSpace($candidate) -and (Test-Path -LiteralPath $candidate)) {
              $iscc = $candidate
              break
            }
          }

          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
              throw "Chocolatey failed to install Inno Setup (exit code $LASTEXITCODE)."
            }

            $iscc = Get-ChildItem -Path @($env:ProgramFiles, ${env:ProgramFiles(x86)}) `
              -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $iscc -or -not (Test-Path -LiteralPath $iscc)) {
            throw 'ISCC.exe was not found after installing Inno Setup.'
          }

          $isccVersionText = (& $iscc /? 2>$null | Select-Object -First 1)
          if ($isccVersionText -notmatch 'Inno Setup\s+6') {
            throw "Inno Setup 6 compiler is required, found: $isccVersionText"
          }
          Write-Host "ISCC: $iscc ($isccVersionText)"
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build UpdateAgent.sln -c Release --nologo

      - name: Test
        run: dotnet test tests\UpdateAgent.Tests\UpdateAgent.Tests.csproj -c Release --no-build --nologo

      - name: Publish applications
        run: .\scripts\publish.ps1 -Configuration Release

      - name: Build Inno Setup installers
        env:
          ISCC_PATH: ${{ steps.inno.outputs.iscc }}
        run: .\scripts\build-inno.ps1 -NoPublish -IsccPath $env:ISCC_PATH

      - name: Build MSI (alternative)
        run: .\scripts\build-msi.ps1

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION

          $innoInfo = Get-Content -LiteralPath 'artifacts\inno\build-info.json' -Raw | ConvertFrom-Json
          $msiInfo = Get-Content -LiteralPath 'artifacts\msi\build-info.json' -Raw | ConvertFrom-Json

          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("# UpdateAgent $version")
          $lines.Add('')
          $lines.Add('컴퓨터실(랩) Windows Update 자동화 도구입니다.')
          $lines.Add('')
          $lines.Add('## 설치 파일')
          $lines.Add('')
          foreach ($setup in $innoInfo.setupFiles) {
            $lines.Add(('- `{0}` ({1:N1} MB)' -f $setup.setupFile, ($setup.sizeBytes / 1MB)))
          }
          $lines.Add(('- `{0}` ({1:N1} MB) — 대안(MSI)' -f $msiInfo.msiFile, ($msiInfo.msiSizeBytes / 1MB)))
          $lines.Add('')
          $lines.Add('## SHA-256')
          $lines.Add('')
          foreach ($setup in $innoInfo.setupFiles) {
            $lines.Add(('- `{0}`: `{1}`' -f $setup.setupFile, $setup.sha256))
          }
          $lines.Add(('- `{0}`: `{1}`' -f $msiInfo.msiFile, $msiInfo.sha256))
          $lines.Add('')
          $lines.Add('## 설치 방법')
          $lines.Add('')
          $lines.Add('- 학생 PC: `UpdateAgent.Agent-Setup-<버전>-x64.exe` 실행')
          $lines.Add('- 교사 PC: `UpdateAgent.LabManager-Setup-<버전>-x64.exe` 실행')
          $lines.Add('- 무인 설치: `/VERYSILENT /SUPPRESSMSGBOXES /NORESTART`')
          $lines.Add('- 전체 안내: https://github.com/ahbiyout-all/WinAutoUpdate/blob/master/docs/INSTALLER.md')
          $lines.Add('')
          $lines.Add('## 참고')
          $lines.Add('')
          $lines.Add('- 설치 파일은 파일럿 단계에서 코드 서명이 없어 SmartScreen 경고가 표시될 수 있습니다.')
          $lines.Add('- 지원: Windows 11, Windows 10 22H2(ESU), Windows Server 2016–2025 (Server Core는 헤드리스)')
          $lines.Add('- 문의/블로그: https://ahbiyoutvibe.blogspot.com/')

          $lines | Set-Content -LiteralPath 'release-notes.md' -Encoding utf8

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $prerelease = $env:RELEASE_PRERELEASE -eq 'true'

          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw 'GitHub CLI (gh) is required but was not found on the runner.'
          }
          & gh --version
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI (gh) failed to start.' }

          # Select only the expected versioned names so stale artifacts cannot be uploaded.
          $expectedInnoNames = @(
            "UpdateAgent.Agent-Setup-$version-x64.exe",
            "UpdateAgent.LabManager-Setup-$version-x64.exe"
          )
          $expectedMsiName = "UpdateAgent.Agent-$version-x64.msi"

          $innoAssets = @($expectedInnoNames | ForEach-Object {
            $path = Join-Path (Join-Path $PWD.Path 'artifacts\inno') $_
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Expected release asset is missing: $path"
            }
            (Resolve-Path -LiteralPath $path).Path
          })
          $msiPath = Join-Path (Join-Path $PWD.Path 'artifacts\msi') $expectedMsiName
          if (-not (Test-Path -LiteralPath $msiPath)) {
            throw "Expected release asset is missing: $msiPath"
          }
          $msiAssets = @((Resolve-Path -LiteralPath $msiPath).Path)
          $assets = @($innoAssets + $msiAssets)

          if ($innoAssets.Count -ne 2) {
            throw "Expected exactly two Inno Setup installers, found $($innoAssets.Count)."
          }
          if ($msiAssets.Count -ne 1) {
            throw "Expected exactly one MSI, found $($msiAssets.Count)."
          }
          foreach ($asset in $assets) {
            $extension = [IO.Path]::GetExtension($asset).ToLowerInvariant()
            if ($extension -notin @('.exe', '.msi')) {
              throw "Unexpected release asset: $asset"
            }
          }

          Write-Host 'Release assets:'
          $assets | ForEach-Object { Write-Host "  $_" }

          # 수동 실행에서는 태그가 없을 수 있으므로 현재 커밋에 태그를 만든다.
          $existingTag = (& git tag --list $tag).Trim()
          if (-not $existingTag) {
            git tag $tag
            if ($LASTEXITCODE -ne 0) { throw "Failed to create tag $tag." }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to push tag $tag." }
          }
          else {
            $tagCommit = (& git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>$null).Trim()
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Existing tag $tag points to $tagCommit, not to $env:GITHUB_SHA."
            }
          }

          $releaseTags = @(& gh release list --limit 200 --json tagName |
            ConvertFrom-Json | ForEach-Object { $_.tagName })

          if ($releaseTags -contains $tag) {
            Write-Host "Updating existing release $tag."
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload assets to $tag." }

            $editArgs = @('release', 'edit', $tag, '--title', "UpdateAgent $version",
              '--notes-file', 'release-notes.md')
            if ($prerelease) { $editArgs += '--prerelease' } else { $editArgs += '--prerelease=false' }
            & gh @editArgs
            if ($LASTEXITCODE -ne 0) { throw "Failed to edit release $tag." }
          }
          else {
            Write-Host "Creating release $tag."
            $ghArgs = @('release', 'create', $tag) + $assets +
              @('--verify-tag', '--title', "UpdateAgent $version", '--notes-file', 'release-notes.md')
            if ($prerelease) { $ghArgs += '--prerelease' }

            & gh @ghArgs
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag." }
          }

          Write-Host "Release $tag published."
