name: Release

# 릴리스는 v<Major.Minor.Build> 태그 또는 수동 실행으로 만든다.
# 수동 실행에서는 Directory.Build.props의 <Version>만 사용한다(입력으로 버전을 바꾸지 않음).
# 릴리스 자산에는 설치 파일만 올린다. 해시는 릴리스 노트에 기록한다.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark this release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  RELEASE_PRERELEASE: ${{ inputs.prerelease }}

jobs:
  release:
    name: Build installers and publish release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve and verify version
        id: version
        run: |
          $ErrorActionPreference = 'Stop'
          $propsPath = 'Directory.Build.props'
          $text = Get-Content -LiteralPath $propsPath -Raw
          if ($text -notmatch '<Version>\s*([^<]+?)\s*</Version>') {
            throw "No <Version> element found in $propsPath."
          }
          $version = $Matches[1].Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be Major.Minor.Build (digits only): $version"
          }

          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne $tag) {
              throw "Tag $env:GITHUB_REF_NAME does not match Directory.Build.props version $version."
            }
          }
          else {
            # 수동 실행에서 이미 같은 태그가 다른 커밋을 가리키면 잘못된 릴리스를 막는다.
            $existingCommit = (@(& git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>$null) -join '').Trim()
            # rev-parse가 1을 반환하는 것은 '태그 없음'이며 정상 경로다. 단계 전체가 실패하지 않도록 초기화한다.
            $global:LASTEXITCODE = 0
            if (-not [string]::IsNullOrWhiteSpace($existingCommit) -and
                $existingCommit -ne $env:GITHUB_SHA) {
              throw "Tag $tag already points to $existingCommit, not to $env:GITHUB_SHA. Update Directory.Build.props instead."
            }
          }

          Write-Host "Release version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup 6
        id: inno
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $iscc = $null
          foreach ($candidate in @(
              (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
              (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )) {
            if (-not [string]::IsNullOrWhiteSpace($candidate) -and (Test-Path -LiteralPath $candidate)) {
              $iscc = $candidate
              break
            }
          }

          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
              throw "Chocolatey failed to install Inno Setup (exit code $LASTEXITCODE)."
            }

            $iscc = Get-ChildItem -Path @($env:ProgramFiles, ${env:ProgramFiles(x86)}) `
              -Filter 'ISCC.exe' -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $iscc -or -not (Test-Path -LiteralPath $iscc)) {
            throw 'ISCC.exe was not found after installing Inno Setup.'
          }

          $isccVersionText = (& $iscc /? 2>$null | Select-Object -First 1)
          if ($isccVersionText -notmatch 'Inno Setup\s+6') {
            throw "Inno Setup 6 compiler is required, found: $isccVersionText"
          }
          Write-Host "ISCC: $iscc ($isccVersionText)"
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build UpdateAgent.sln -c Release --nologo

      - name: Test
        run: dotnet test tests\UpdateAgent.Tests\UpdateAgent.Tests.csproj -c Release --no-build --nologo

      - name: Publish applications
        run: .\scripts\publish.ps1 -Configuration Release

      - name: Build Inno Setup installers
        env:
          ISCC_PATH: ${{ steps.inno.outputs.iscc }}
          UPDATEAGENT_AGENT_TOKEN: ${{ secrets.UPDATEAGENT_AGENT_TOKEN }}
          UPDATEAGENT_LABMANAGER_ADMIN_TOKEN: ${{ secrets.UPDATEAGENT_LABMANAGER_ADMIN_TOKEN }}
          UPDATEAGENT_LABMANAGER_AGENT_TOKEN: ${{ secrets.UPDATEAGENT_LABMANAGER_AGENT_TOKEN }}
        run: .\scripts\build-inno.ps1 -NoPublish -IsccPath $env:ISCC_PATH

      - name: Build MSI (alternative)
        run: .\scripts\build-msi.ps1

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          UPDATEAGENT_AGENT_TOKEN: ${{ secrets.UPDATEAGENT_AGENT_TOKEN }}
          UPDATEAGENT_LABMANAGER_ADMIN_TOKEN: ${{ secrets.UPDATEAGENT_LABMANAGER_ADMIN_TOKEN }}
          UPDATEAGENT_LABMANAGER_AGENT_TOKEN: ${{ secrets.UPDATEAGENT_LABMANAGER_AGENT_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $currentVersion = $null
          if (-not [version]::TryParse($version, [ref]$currentVersion)) {
            throw "Cannot parse release version: $version"
          }

          $innoInfo = Get-Content -LiteralPath 'artifacts\inno\build-info.json' -Raw | ConvertFrom-Json
          $msiInfo = Get-Content -LiteralPath 'artifacts\msi\build-info.json' -Raw | ConvertFrom-Json

          # 잘못된 버전/시크릿 메타데이터가 있는 아티팩트는 릴리스하지 않는다.
          foreach ($pair in @(@('Inno', $innoInfo), @('MSI', $msiInfo))) {
            $label = $pair[0]
            $info = $pair[1]
            if ($info.productVersion -ne $version) {
              throw "$label build-info productVersion '$($info.productVersion)' does not match $version."
            }
          }
          $hasAgentToken = -not [string]::IsNullOrWhiteSpace($env:UPDATEAGENT_AGENT_TOKEN)
          $hasLabAgentToken = -not [string]::IsNullOrWhiteSpace($env:UPDATEAGENT_LABMANAGER_AGENT_TOKEN)
          $hasAdminToken = -not [string]::IsNullOrWhiteSpace($env:UPDATEAGENT_LABMANAGER_ADMIN_TOKEN)
          if ($hasAdminToken -ne $hasLabAgentToken) {
            throw 'UPDATEAGENT_LABMANAGER_ADMIN_TOKEN and UPDATEAGENT_LABMANAGER_AGENT_TOKEN must be set together or left unset together.'
          }
          if ($hasAgentToken -and $hasLabAgentToken) {
            $normalizedAgentToken = $env:UPDATEAGENT_AGENT_TOKEN.TrimStart([char]0xFEFF).Trim()
            $normalizedLabAgentToken = $env:UPDATEAGENT_LABMANAGER_AGENT_TOKEN.TrimStart([char]0xFEFF).Trim()
            if ($normalizedAgentToken -cne $normalizedLabAgentToken) {
              throw 'Configured agent token values do not match; refusing to publish an inconsistent release.'
            }
          }
          $expectedSecrets = $hasAgentToken -or $hasAdminToken
          if ([bool]$innoInfo.containsSecrets -ne [bool]$expectedSecrets) {
            throw "Inno build-info containsSecrets '$($innoInfo.containsSecrets)' does not match the configured token secrets."
          }

          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("# UpdateAgent $version")
          $lines.Add('')
          $lines.Add('컴퓨터실(랩) Windows Update 자동화 도구입니다.')
          $lines.Add('')
          $lines.Add('## 설치 파일')
          $lines.Add('')
          foreach ($setup in $innoInfo.setupFiles) {
            $lines.Add(('- `{0}` ({1:N1} MB)' -f $setup.setupFile, ($setup.sizeBytes / 1MB)))
          }
          $lines.Add(('- `{0}` ({1:N1} MB) — 대안(MSI)' -f $msiInfo.msiFile, ($msiInfo.msiSizeBytes / 1MB)))
          $lines.Add('')
          $lines.Add('## SHA-256')
          $lines.Add('')
          foreach ($setup in $innoInfo.setupFiles) {
            $lines.Add(('- `{0}`: `{1}`' -f $setup.setupFile, $setup.sha256))
          }
          $lines.Add(('- `{0}`: `{1}`' -f $msiInfo.msiFile, $msiInfo.sha256))
          $lines.Add('')
          $lines.Add('## 주요 변경 사항')
          $lines.Add('')
          # 고정 문구는 다음 릴리스에서 거짓 정보가 되므로 이전 태그 이후 커밋 제목을 사용한다.
          # 태그 이름을 문자열로 비교하지 말고 버전 숫자로 비교해 현재 태그보다 낮은 최신 태그를 고른다.
          $previousTag = ''
          $previousVersion = $null
          foreach ($candidate in @(& git tag --list 'v*')) {
            $candidateVersion = $null
            if ($candidate -match '^v(\d+\.\d+(?:\.\d+){0,2})(?:[-+].*)?$' -and
                [version]::TryParse($Matches[1], [ref]$candidateVersion) -and
                $candidateVersion -lt $currentVersion -and
                ($null -eq $previousVersion -or $candidateVersion -gt $previousVersion)) {
              $previousVersion = $candidateVersion
              $previousTag = $candidate
            }
          }
          $global:LASTEXITCODE = 0
          $changeLines = @()
          if (-not [string]::IsNullOrWhiteSpace($previousTag)) {
            $range = "$previousTag..HEAD"
            $commitCount = (& git rev-list --count $range 2>$null)
            $countExit = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            if ($countExit -ne 0) { throw "Could not count commits in range $range." }
            if ([int]$commitCount -gt 0) {
              $changeLines = @(& git log --pretty=format:'- %s' $range 2>$null)
              $logExit = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              if ($logExit -ne 0 -or $changeLines.Count -eq 0) {
                throw "Could not read commit subjects in range $range."
              }
            }
          }
          if ($changeLines.Count -eq 0) {
            $lines.Add('- 변경 내역은 저장소의 docs/WORKLOG.md에서 해당 버전 항목을 확인하세요.')
          }
          else {
            foreach ($change in @($changeLines | Select-Object -First 30)) { $lines.Add($change) }
            $lines.Add('- 전체 변경 내역: https://github.com/ahbiyout-all/WinAutoUpdate/blob/master/docs/WORKLOG.md')
          }
          $lines.Add('')
          $lines.Add('## 설치 방법')
          $lines.Add('')
          $lines.Add(('- 학생 PC: `UpdateAgent.Agent-Setup-{0}-x64.exe` 실행' -f $version))
          $lines.Add(('- 교사 PC: `UpdateAgent.LabManager-Setup-{0}-x64.exe` 실행' -f $version))
          $lines.Add('- 학생 PC 전체 무인 설치(권장): 설치 exe와 같은 폴더에 `agent-install.ini`와 토큰 파일을 둡니다.')
          $lines.Add('```ini')
          $lines.Add('[Agent]')
          $lines.Add('LabManagerUrl=http://labmanager:5080')
          $lines.Add('AgentTokenFile=agent-token.txt')
          $lines.Add('```')
          $lines.Add('```powershell')
          $lines.Add(('.\UpdateAgent.Agent-Setup-{0}-x64.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -f $version))
          $lines.Add('```')
          $lines.Add('- 토큰 값은 INI에 쓰지 않고 토큰 파일 첫 줄에만 둡니다. 명령줄 `/LabManagerUrl`, `/AgentTokenFile`은 대안으로 지원합니다.')
          $lines.Add('- 릴리스 빌드에 `UPDATEAGENT_*` 토큰 secret이 설정되어 있으면 설치 exe에 **첫 설치 전용 토큰**이 포함됩니다. 명시적 외부 토큰 파일이 있으면 그것이 우선하고, 외부 토큰 파일 없이 기존 설치를 교체(업그레이드)할 때는 릴리스에 내장된 토큰이 사용되며, 기존 구성을 재사용하는 업그레이드에서는 기존 토큰이 유지됩니다.')
          $lines.Add('- 내장 토큰은 설치 파일에서 추출할 수 있으므로 파일럿용으로 취급하고, 설치 직후 관리자 토큰을 교체하세요.')
          $lines.Add('- 전체 안내: https://github.com/ahbiyout-all/WinAutoUpdate/blob/master/docs/INSTALLER.md')
          $lines.Add('')
          $lines.Add('## 참고')
          $lines.Add('')
          $lines.Add('- 설치 파일은 파일럿 단계에서 코드 서명이 없어 SmartScreen 경고가 표시될 수 있습니다.')
          $lines.Add('- 지원: Windows 11, Windows 10 22H2(ESU), Windows Server 2016–2025 (Server Core는 헤드리스)')
          $lines.Add('- 문의/블로그: https://ahbiyoutvibe.blogspot.com/')

          $lines | Set-Content -LiteralPath 'release-notes.md' -Encoding utf8

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $prerelease = $env:RELEASE_PRERELEASE -eq 'true'

          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw 'GitHub CLI (gh) is required but was not found on the runner.'
          }
          & gh --version
          if ($LASTEXITCODE -ne 0) { throw 'GitHub CLI (gh) failed to start.' }

          # Select only the expected versioned names so stale artifacts cannot be uploaded.
          $expectedInnoNames = @(
            "UpdateAgent.Agent-Setup-$version-x64.exe",
            "UpdateAgent.LabManager-Setup-$version-x64.exe"
          )
          $expectedMsiName = "UpdateAgent.Agent-$version-x64.msi"

          $innoAssets = @($expectedInnoNames | ForEach-Object {
            $path = Join-Path (Join-Path $PWD.Path 'artifacts\inno') $_
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Expected release asset is missing: $path"
            }
            (Resolve-Path -LiteralPath $path).Path
          })
          $msiPath = Join-Path (Join-Path $PWD.Path 'artifacts\msi') $expectedMsiName
          if (-not (Test-Path -LiteralPath $msiPath)) {
            throw "Expected release asset is missing: $msiPath"
          }
          $msiAssets = @((Resolve-Path -LiteralPath $msiPath).Path)
          $assets = @($innoAssets + $msiAssets)

          if ($innoAssets.Count -ne 2) {
            throw "Expected exactly two Inno Setup installers, found $($innoAssets.Count)."
          }
          if ($msiAssets.Count -ne 1) {
            throw "Expected exactly one MSI, found $($msiAssets.Count)."
          }
          foreach ($asset in $assets) {
            $extension = [IO.Path]::GetExtension($asset).ToLowerInvariant()
            if ($extension -notin @('.exe', '.msi')) {
              throw "Unexpected release asset: $asset"
            }
          }

          Write-Host 'Release assets:'
          $assets | ForEach-Object { Write-Host "  $_" }

          # 워크플로에서 태그를 직접 push하면 태그 이벤트가 같은 워크플로를 중복 실행한다.
          # 수동 실행에서는 gh release create가 --target 커밋에 태그를 만들도록 한다.
          $tagCommit = (@(& git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>$null) -join '').Trim()
          $global:LASTEXITCODE = 0
          $verifyTag = $false
          if (-not [string]::IsNullOrWhiteSpace($tagCommit)) {
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Existing tag $tag points to $tagCommit, not to $env:GITHUB_SHA."
            }
            $verifyTag = $true
          }

          # Check this tag's release directly instead of guessing from a limited global list.
          $releaseView = @(& gh release view $tag --json tagName 2>&1)
          $releaseViewExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $releaseExists = $false
          if ($releaseViewExit -eq 0) {
            $releaseInfoText = ($releaseView | Out-String)
            try {
              $releaseInfo = $releaseInfoText | ConvertFrom-Json
            }
            catch {
              throw "Could not parse 'gh release view $tag' output: $releaseInfoText"
            }
            if ($releaseInfo.tagName -ne $tag) {
              throw "Unexpected tag from 'gh release view $tag': $($releaseInfo.tagName)"
            }
            $releaseExists = $true
          }
          else {
            $releaseErrorText = ($releaseView | Out-String)
            # A missing release is expected; any other gh error must fail the workflow.
            if ($releaseErrorText -notmatch 'not found|could not find') {
              throw "Failed to check release $tag (exit code $releaseViewExit): $releaseErrorText"
            }
          }

          if ($releaseExists) {
            Write-Host "Updating existing release $tag."

            # 이전 버전 등 기대하지 않는 자산은 업로드 전에 제거한다.
            $expectedNames = @($expectedInnoNames + $expectedMsiName)
            $currentAssets = @(& gh release view $tag --json assets --jq '.assets[].name' |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
            if ($LASTEXITCODE -ne 0) { throw "Failed to list assets for $tag." }
            foreach ($stale in $currentAssets) {
              if ($stale -notin $expectedNames) {
                & gh release delete-asset $tag $stale --yes
                if ($LASTEXITCODE -ne 0) { throw "Failed to delete stale asset '$stale' from $tag." }
              }
            }

            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload assets to $tag." }

            $editArgs = @('release', 'edit', $tag, '--title', "UpdateAgent $version",
              '--notes-file', 'release-notes.md')
            if ($prerelease) { $editArgs += '--prerelease' } else { $editArgs += '--prerelease=false' }
            & gh @editArgs
            if ($LASTEXITCODE -ne 0) { throw "Failed to edit release $tag." }
          }
          else {
            Write-Host "Creating release $tag."
            $ghArgs = @('release', 'create', $tag) + $assets +
              @('--title', "UpdateAgent $version", '--notes-file', 'release-notes.md')
            if ($verifyTag) { $ghArgs += '--verify-tag' }
            else { $ghArgs += @('--target', $env:GITHUB_SHA) }
            if ($prerelease) { $ghArgs += '--prerelease' }

            & gh @ghArgs
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag." }
          }

          Write-Host "Release $tag published."
